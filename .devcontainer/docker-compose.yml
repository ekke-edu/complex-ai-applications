version: '3.8'

services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.11
    volumes:
      - ../:/workspaces/complex-ai-applications:cached
    command: sleep infinity
    depends_on:
      - mongo
      - neo4j

  mongo:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  neo4j:
    image: neo4j:5.23.0
    restart: unless-stopped
    ports:
      - "9474:7474" # A böngészős felület (http://localhost:9474)
      - "7687:7687" # Python Bolt kapcsolat
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - neo4j-data:/data

volumes:
  mongo-data:
  neo4j-data:
